<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#fff8f5">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❤️%3C/text%3E%3C/svg%3E">
	<title>Artur & Gicely</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #fce6ec;
			--ink: #503b3c;
			--rose: #d84f78;
			--rose-dark: #b63861;
			--line: #e8c9cd;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 16px;
			padding: 48px 20px;
			color: var(--ink);
			background-color: var(--paper);
			background-image: radial-gradient(#e9d8d1 0.7px, transparent 0.7px);
			background-size: 18px 18px;
			font-family: Georgia, 'Times New Roman', serif;
		}

		.site-footer {
			color: var(--rose-dark);
			font: 0.82rem/1.5 Arial, sans-serif;
			text-align: center;
		}

		main {
			width: min(100%, 620px);
			padding: clamp(28px, 7vw, 64px);
			text-align: center;
			background: rgba(255, 252, 249, 0.94);
			border: 1px solid #f0dfda;
			box-shadow: 0 18px 50px rgba(104, 57, 64, 0.09);
			animation: arrive 700ms ease-out both;
		}

		.eyebrow {
			margin: 0 0 18px;
			color: var(--rose-dark);
			font: 600 0.74rem/1.4 Arial, sans-serif;
			letter-spacing: 0.16em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 470px;
			margin: 0 auto;
			color: var(--rose);
			font-size: clamp(2.35rem, 8vw, 4.1rem);
			font-weight: 400;
			line-height: 1.08;
		}

		.message {
			max-width: 420px;
			margin: 22px auto 34px;
			color: var(--rose-dark);
			font-size: 1.08rem;
			line-height: 1.8;
		}

		.photo-frame {
			width: min(100%, 420px);
			margin: 0 auto;
			overflow: hidden;
			border: 1px solid var(--line);
			background: #faeeea;
		}

		.photo-frame img {
			display: block;
			width: 100%;
			height: auto;
			max-height: 72vh;
			object-fit: contain;
		}

		@keyframes arrive {
			from { opacity: 0; transform: translateY(12px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: 0.01ms !important;
			}
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Com todo o meu amor</p>
		<h1>Eu não fico um segundo sem pensar em você</h1>
		<p class="message">
			Obrigado por nunca deixar de estar ao meu lado, mesmo quando está tudo difícil. Eu quero viver pra sempre com sua companhia, sua amizade, e acima de tudo seu amor. EU TE AMO MINHA PRINCESINHA!
		</p>

		<figure class="photo-frame">
			<img src="tutugigi.jpeg" alt="Uma foto de vocês dois">
		</figure>
	</main>
	<footer class="site-footer">AMOR ETERNO DA FELICIDADE</footer>

</body>
</html>
